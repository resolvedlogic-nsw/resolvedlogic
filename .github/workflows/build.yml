name: Build site

# When anything in src/ (or build.py) changes on main, rebuild the .html pages
# and commit them back, so edits made in the GitHub web editor go live too.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build.py
      - name: Commit rebuilt pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No page changes."
          else
            git commit -m "Rebuild pages from src/"
            git push
          fi
