[[project]]
title = "Summerfest Registration"
ledger = true
tag = "Registration / Events"
url = "https://summerfestrego.lighthouse.net.au"
from = "Registration Chaos"
to = "Rapid Check-In"
problem = "Managing 400+ registrations and on-site check-ins manually created dangerous delays for medical and dietary tracking at a youth summer festival."
logic = "A high-availability registration portal bridging digital sign-up with physical arrival — built for speed, safety, and zero-friction volunteer operation."
result = "Zero-wait entry for families and instant digital medical manifests for event safety teams on the day."
stats = [
  { value = "3–4 min → <30 sec", label = "per-family check-in" },
]
