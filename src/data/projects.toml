# Case studies, shown on the Designs page in the order they appear here.
# To add one, copy a whole [[project]] block (including its [[project.features]] blocks) and edit it.
# Add `ledger = true` to show a project's before/after on the home page.
# Numbers (01, 02...) are generated automatically. Run `python build.py` afterwards.

[[project]]
title = "FosterRoster"
ledger = true
tag = "SaaS / Rescue Management"
url = "https://fosterroster.com.au"
flagship = true
from = "Manual Rescue Ops"
to = "Unified Platform"
problem = "Independent animal rescues run intake, fostering, medical care, litters, contracts and finances across scattered spreadsheets, paper forms and group chats — nothing talks to each other, and none of it scales past a handful of volunteers."
logic = "A configurable multi-tenant SaaS platform generalising the workflows built for individual rescues into one product — animal roster, litter tracking, medical records, adoption pipeline, financials and operations, deployable white-labelled to any Australian rescue."
result = "One login for everything — from a newborn litter's daily weigh-ins to a signed, invoiced adoption contract — with self-serve foster access and reporting that used to require a bespoke build per organisation."
cover = "static/img/foster-home.jpg"
stats = [
  { value = "5", label = "core modules" },
  { value = "20+", label = "features shipped" },
  { value = "Multi-tenant", label = "SaaS" },
  { value = "White-label", label = "per org" },
]
images = [
  { src = "static/img/foster1.png", alt = "Homepage" },
  { src = "static/img/foster2.png", alt = "Roster dashboard" },
  { src = "static/img/foster3.png", alt = "Dashboard layout icons" },
  { src = "static/img/foster4.png", alt = "Animal profile" },
  { src = "static/img/foster5.png", alt = "Litter weigh-in tool" },
]

[[project.features]]
heading = "Animal Management"
items = [
  "Multi-View Roster: Cards, list or compact views, grouped by species, status or carer",
  "Guided Intake: Step-by-step wizard, plus a fast multi-littermate intake flow",
  "Weigh The Litter: Wheel-based nursery weigh-in tool with growth charts per kitten/pup",
  "Treatment Matrix: Vaccinations, worming, desexing and medicine inventory in one view",
]

[[project.features]]
heading = "People & CRM"
items = [
  "Unified Contacts: Team (staff, carers, vets, donors) and Customer views in one directory",
  "Adaptive Profiles: A contact's page reshapes around their foster or adoption history automatically",
  "Household Profiling: Logistics captured per household, not just per person",
  "Communications Timeline: Every contact's history in one scrollable thread",
]

[[project.features]]
heading = "Adoption Pipeline"
items = [
  "Public Adoption Portal: Branded, per-organisation, fed straight from the live roster",
  "Application Review: Online applications with a built-in staff review workflow",
  "E-Signed Contracts: Adoption, foster, transfer and surrender — signed on screen, auto-filed",
  "Auto-Invoicing: The adoption fee is invoiced the moment a contract is signed",
]

[[project.features]]
heading = "Financials"
items = [
  "Expense Ledger: Filterable payment/expense history with PDF receipt generation",
  "Cash Reconciliation: A \"banked date\" field keeps physical cash handling auditable",
  "Split Expenses: One vet invoice divided automatically across a whole litter",
  "Financial History: Per-animal and per-person views, not just one master ledger",
]

[[project.features]]
heading = "Operations & Platform"
items = [
  "Task Management: Due dates, assignment and recurrence for rescue chores",
  "Compliance Tracking: State-based council and legal requirements built in",
  "Custom Dashboard: Drag-to-reorder cards with multiple density modes",
  "Role-Based Access: Capability-level staff permissions, invited by email, per-org data isolation",
]

[[project]]
title = "Budget Tyre Shed — Tyre Tracking & Reporting"
ledger = true
tag = "Automotive / Inventory & Reporting"
from = "Paper Job Sheets"
to = "Digital Fleet Records"
problem = "Every tyre fitted, rotated or replaced was tracked on paper dockets — no way to see sales trends, staff performance, or a vehicle's tyre history without digging through a filing cabinet."
logic = "A purpose-built CRM that replaces the paper docket with a digital sale record tied to the vehicle, its service history and the exact tyre spec sold — backed by an owner-curated fitment and vehicle knowledge base so counter staff can find the right tyre in seconds."
result = "Every install, rotation and puncture repair is logged against the vehicle it happened to, with sales reports and an audit trail available in a few clicks instead of a few hours."

[[project.features]]
heading = "Technical Logic"
items = [
  "Fitment Lookup: Vehicle make/model/year matched against a curated fitment-rules table to find the correct tyre and wheel spec in seconds",
  "Tyre & Vehicle Knowledge Base: Structured tyre width/aspect-ratio/rim hierarchy and vehicle variant database, with CSV import to bulk-load reference data",
  "Sales & Service History: Every install, rotation, balance, alignment and puncture repair logged per vehicle, with odometer readings and km-on-tyres tracking",
  "Void, Not Delete: Sales are voided rather than removed — who entered it, who voided it and why all stay on the record",
  "Sales Reporting: Reports grouped by day, week or month covering revenue, volume and profit-per-install trends",
  "Role-Based Staff Accounts: Owner-only team management, so deactivating a staff member never orphans their sale history",
]

[[project.features]]
heading = "Human Impact"
items = [
  "Faster Counter Service: Staff pull up a vehicle's rego and see its full tyre history instead of asking the customer to remember",
  "Confident Recommendations: Fitment lookup means new staff can quote the right tyre size without years of tribal knowledge",
  "Ownership Visibility: The owner sees sales and profit trends at a glance instead of reconciling paper dockets at month-end",
  "Accountability: Every sale is tied to the staff member who entered it — protects the business and the customer if a dispute comes up",
  "No Lost Records: Vehicle and customer history persists even as staff turn over, since voided or edited records are kept, not deleted",
]

