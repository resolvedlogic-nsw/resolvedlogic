# Copy that appears in more than one place (the home page and the About page).

# The three process stages. `short` is used on the home page, `long` on About.
# `tangle` controls the strand artwork: higher is more tangled, lower is straighter.
[[step]]
title = "Understand"
state = "TANGLED"
tangle = 1.9
short = "Map the workflows, data and pain points before touching a screen."
long = "I start with deep discovery: mapping your current workflows, data sources, pain points and goals. I ask the uncomfortable questions so the solution fits the problem, not a guess at it."

[[step]]
title = "Structure"
state = "MAPPED"
tangle = 1.0
short = "Data models, user flows and access rules, agreed before any code."
long = "Before any code is written, I design the logical architecture: data models, user flows, access controls and integration points. You see and approve the blueprint before I build it."

[[step]]
title = "Build & Deliver"
state = "RESOLVED"
tangle = 0.2
short = "Focused sprints, regular check-ins, then documentation and training."
long = "I build in focused sprints with regular check-ins. No black boxes. When I deliver, I don't disappear: I document, train and support until your team is fully confident and self-sufficient."

[[value]]
title = "Clarity first"
text = "I don't start building until I understand the problem completely. Most of the work happens before a single line of code is written."

[[value]]
title = "No fluff"
text = "I build exactly what solves the problem. Features that don't serve a clear purpose don't get built. Complexity is the enemy."

[[value]]
title = "Long-term thinking"
text = "Every decision is made with future maintainability in mind. Systems I build today should still make sense in five years."

[[value]]
title = "Human-centred"
text = "Technical excellence means nothing if the people using the system find it confusing or frustrating. Usability is non-negotiable."

